name: Build DR WORLD APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip DR WORLD Source
        run: |
          unzip -o DR-WORLD-2.2.0.zip || true
          ls -la
          cp -r DR-WORLD-2.2.0/../ 2>/dev/null || true
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Debug APK
        run:./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DR-WORLD-V2.2.0
          path: app/build/outputs/apk/debug/*.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-${{ github.run_number }}
          name: DR WORLD v2.2.0 by Dayaram Chouhan
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
